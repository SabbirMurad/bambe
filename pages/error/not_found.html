<!DOCTYPE html>
<html lang="en" data-store-theme="{{ store_theme | default(value='orange') }}" data-currency="{{ store_currency | default(value='BDT') }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Page not found — Bambee</title>
{% include "common/favicon.html" %}
<link rel="stylesheet" href="/assets/css/common.css">
<style>
  .nf-wrap {
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
  }
  .nf-code {
    font-family: var(--font-head);
    font-size: 84px;
    font-weight: 700;
    line-height: 1;
    color: var(--primary);
    letter-spacing: -2px;
  }
  .nf-title { font-family: var(--font-head); font-size: 24px; font-weight: 600; color: var(--ink); }
  .nf-text  { font-size: 14px; color: var(--mid); max-width: 420px; }
  .nf-links { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="nav-logo">
      <div class="nav-logo-mark"></div>
      <span class="nav-logo-text">ambee</span>
    </a>
  </div>
</nav>

<main class="container">
  <div class="nf-wrap">
    <div class="nf-code">404</div>
    <div class="nf-title">We couldn&rsquo;t find that page</div>
    <p class="nf-text">The link may be out of date, or the page may have moved. Try starting from the home page or search for what you need.</p>
    <div class="nf-links">
      <a class="btn btn-primary" href="/">Back to home</a>
      <a class="btn btn-secondary" href="/search">Search products</a>
    </div>
  </div>
</main>

</body>
</html>
