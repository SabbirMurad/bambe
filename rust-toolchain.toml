# Pins the compiler for everyone who builds this.
#
# Without it, contributors get whatever rustc they happen to have, and a build
# that works on one machine can fail on another over an edition or a lint that
# moved. `edition = "2024"` in Cargo.toml already requires a recent toolchain;
# this states which one rather than leaving it to chance.
#
# Raise `channel` deliberately, as its own commit, so a toolchain bump is
# reviewable instead of arriving mixed into an unrelated change.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
